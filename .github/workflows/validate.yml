name: Validate PARALLAX v11 skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline structural validation
        run: python tools/validate.py
      - name: Offline capability and provenance checks
        run: |
          python tools/capability_audit.py
          python tools/source_audit.py
          python tools/route_task.py "Design an accessible app with API and video"
          python tools/bench_compare.py examples/paired-evaluation.json
      - name: Audio and evolution smoke checks
        run: |
          python tools/voice_route.py examples/voice-task.json examples/voice-backends.json
          python tools/evolve_gate.py examples/evolution-fixture.json
      - name: Coding logic and performance smoke checks
        run: |
          python tools/complexity_guard.py tools/critical_path.py --max-score 50
          python tools/critical_path.py examples/workflow-dag.json
          python tools/perf_gate.py examples/perf-pairs.json
      - name: Check time-budgeted work ledger
        run: |
          python tools/work_budget.py examples/work-session-50min.json --output /tmp/parallax-work-ledger.json
      - name: Planning and independent worker smoke checks
        run: |
          python tools/plan_engine.py examples/planning-v10.3.json --output /tmp/parallax-plan.json
          python tools/agent_audit.py examples/planning-v10.3.json --out /tmp/parallax-audits.json
          python -m unittest tests.test_planning_v10_3 -v
      - name: V10.4 planning and evidence smoke checks
        run: |
          python tools/resource_scheduler.py examples/planning-v10.3.json
          python tools/skill_dispatch.py "Create a beautiful accessible app" --max-skills 2
          python tools/quality_gate.py examples/quality-v10.4.json
          python -m unittest tests.test_v10_4 -v
      - name: V10.5 source freshness and DeepSeek fallback smoke checks
        run: |
          python tools/deepseek_get_probe.py '7*6'
          python tools/design_contract.py examples/design-contract-v10.5.json
          python -m unittest tests.test_v10_5 -v
      - name: V11 image, automation and source-integrity smoke checks
        run: |
          python tools/image_contract.py examples/image-intent-v11.json
          python tools/workflow_risk_audit.py examples/automation-audit-v11.json
          python tools/capability_catalog.py "image reference" --limit 2
          python -m unittest tests.test_v11 -v
      - name: Check GET-only catalog against repository contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('bridge/v1')
          ix=json.loads((p/'index.json').read_text())
          assert ix['counts']=={'skills':142,'sources':157}
          for kind, ground in [('skills', sorted(x.parent.name for x in Path('skills').glob('*/SKILL.md'))),('sources', json.loads(Path('sources/sources.json').read_text())['sources'])]:
              rows=[];offset=0
              for n in ix['pages'][kind]:
                  j=json.loads((p/n).read_text())
                  assert j['kind']==kind and j['offset']==offset and j['count']==len(j['entries'])
                  rows+=j['entries'];offset+=len(j['entries'])
              assert len(rows)==ix['counts'][kind]
              if kind=='skills':assert rows==ground and len(set(rows))==len(rows)
              else:assert [(r['name'],r['url']) for r in rows]==[(r['name'],r['url']) for r in ground]
          print('PASS: all 142 skills and 157 sources present in small GET pages')
          PY
      - name: Compile scripts
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install FFmpeg for smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Verify actual MP4 rendering and probe output
        run: |
          python tools/render_video.py examples/video-storyboard.json --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --out /tmp/parallax-smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -of json /tmp/parallax-smoke.mp4
      - name: V10 frame-accurate timeline, subtitle and media QC integration
        run: |
          python tools/video_timeline.py examples/v10-timeline.json --storyboard-out /tmp/v10-storyboard.json --srt-out /tmp/v10-captions.srt --edl-out /tmp/v10-edl.json
          python tools/render_video.py /tmp/v10-storyboard.json --out /tmp/v10-demo.mp4
          python tools/video_qc.py /tmp/v10-demo.mp4 --contract examples/v10-video-contract.json
          test -s /tmp/v10-captions.srt
          test -s /tmp/v10-edl.json
